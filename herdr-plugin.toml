id = "gh-view"
name = "GitHub PR View"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Right-side panel showing the focused worktree's PR: draft/open, stack, CI, and review comments."
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "herdr-gh-view", "."]

[[panes]]
id = "panel"
title = "GitHub PR"
placement = "split"
command = ["./herdr-gh-view"]

# Stacks under the AI Usage panel when it is open in this tab, otherwise opens
# to the right of the focused pane. Neither steals focus.
# Close it with `q` inside the panel.
[[actions]]
id = "open"
title = "Open GitHub PR panel"
contexts = ["global"]
command = ["./herdr-gh-view", "open"]
